spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:43200000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  admin:
    # Obrigatório em produção: substitui a senha padrão criada pela migration V2
    password: ${ADMIN_PASSWORD}
