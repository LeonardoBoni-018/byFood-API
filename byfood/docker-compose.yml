services:
  postgres:
    image: postgres:16
    container_name: byfood-postgres
    environment:
      POSTGRES_DB: byfood
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d byfood"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: byfood-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/byfood
      DB_USERNAME: postgres
      DB_PASSWORD: 123456
      JWT_SECRET: byfood-prod-secret-key-change-in-production-123456
      JWT_EXPIRATION: "86400000"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
